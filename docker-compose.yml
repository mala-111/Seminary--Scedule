services:

  sqlserver:
    image: postgres:16
    container_name: pg-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: ScheduleDb
    ports:
    - "5432:5432"
    volumes:
    - sql_data:/var/lib/postgresql/data

  server:
    image: yourdockerhubusername/server:latest
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: my-api
    depends_on:
      - sqlserver
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=pg-db;Port=5432;Database=ScheduleDb;Username=postgres;Password=1234
    ports:
      - "8080:8080"

  client:
    image: yourdockerhubusername/client:latest
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: my-react-app
    depends_on:
      - server
    ports:
      - "80:80"

volumes:
  sql_data: