services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sql-server-2022-new
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "SeminarySchedule123!"
    ports:
      - "1434:1433"
    volumes:
      - sql_data:/var/opt/mssql

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: my-api
    depends_on:
      - sqlserver
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=ScheduleDb;User Id=SA;Password=SeminarySchedule123!;TrustServerCertificate=true;MultipleActiveResultSets=true;"
    ports:
      - "8080:8080"

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: my-react-app
    depends_on:
      - server
    ports:
      - "80:80"
    environment:
    - VITE_API_URL=http://server:8080

volumes:
  sql_data: